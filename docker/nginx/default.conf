upstream php-fpm {
    server php-fpm:9000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # Redirect all HTTP to HTTPS (except certbot challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    # SSL configuration (update paths after certbot generates certs)
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Connection limits
    limit_conn addr 100;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/xml+rss text/xml;

    # Deny access to sensitive files
    location ~* \.(env|env\..*|htaccess|git|svn) {
        deny all;
        return 404;
    }

    location ~* /(config\.php|db\.php|auth_middleware\.php|setup\.php|composer\.(json|lock)|deploy_database\.sql|database.*\.sql|migration_.*\.sql|phpunit\.xml)$ {
        deny all;
        return 404;
    }

    # Deny access to sensitive directories
    location ~ ^/(cache|\.rate_limit|logs|src|tests|docs|scripts|frontend|cgi-bin|node_modules|vendor)/ {
        deny all;
        return 404;
    }

    # Vendor assets are versioned via ?v= — cache for a year
    location ^~ /assets/vendor/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static file caching
    location ~* \.(js|css)$ {
        expires 1M;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploads — serve static, no PHP
    location /uploads/ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # API endpoints — higher rate limit
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # Login endpoint — strict rate limit
    location = /api/auth.php {
        limit_req zone=login burst=3 nodelay;
        try_files $uri /api/auth.php?$query_string;
    }

    # Health check endpoint (no rate limit, no logging)
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # General rate limit
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        limit_req zone=general burst=20 nodelay;
        try_files $uri =404;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param HTTP_PROXY "";
    }

    # Disable access log for favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Disable access log for robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Default charset
    charset utf-8;
}
