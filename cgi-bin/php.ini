; Minimal php.ini overrides for shared hosting (CGI/FPM).
; Keep only what the hosting actually needs — do NOT replicate a full php.ini.

[PHP]
; Upload limits
upload_max_filesize = 20M
post_max_size = 20M

; Execution limits
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Memory
memory_limit = 128M

; Security — disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,show_source

; Do not expose PHP version in headers
expose_php = Off

; Errors — log but do not display
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Timezone
[Date]
date.timezone = Asia/Almaty

; Session hardening
[Session]
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
